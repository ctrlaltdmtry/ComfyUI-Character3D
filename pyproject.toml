[project]
name = "comfyui-character3d"
version = "0.5.1"
description = "Standalone Three.js adult character editor with immutable ComfyUI PNG snapshots"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["numpy>=1.24", "Pillow>=10.0", "torch>=2.0", "aiohttp>=3.9"]

[project.urls]
Repository = "https://github.com/ctrlaltdmtry/ComfyUI-Character3D"
Documentation = "https://github.com/ctrlaltdmtry/ComfyUI-Character3D#readme"
"Bug Tracker" = "https://github.com/ctrlaltdmtry/ComfyUI-Character3D/issues"

[tool.comfy]
PublisherId = "ctrlaltdmtry"
DisplayName = "Character / 3D Editor"
